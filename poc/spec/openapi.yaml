openapi: 3.1.1
info:
  title: shop-sim API
  version: 0.1.0
  description: API 클라이언트 도구 비교용 스펙 (POC web#1). shop-sim-api openapi/CONVENTIONS.md를 따른다
servers:
  - url: http://localhost:3000/api
paths:
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: 상품 목록 (커서)
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: pageToken
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: 상품 단건 조회
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 상품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart-items:
    post:
      operationId: addCartItem
      tags: [cart-items]
      summary: 장바구니에 담기
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '201':
          description: 담긴 항목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  responses:
    BadRequest:
      description: 요청이 스펙과 맞지 않음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 리소스가 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 현재 상태와 충돌 (재고 부족 등)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ProductStatus:
      type: string
      enum: [ON_SALE, SOLD_OUT]
    Product:
      type: object
      additionalProperties: false
      required: [id, name, price, status, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        price: { type: integer, minimum: 0, description: 원 단위 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        description: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, nextPageToken]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        nextPageToken: { type: [string, 'null'] }
    AddCartItemRequest:
      type: object
      additionalProperties: false
      required: [skuId, quantity]
      properties:
        skuId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    CartItem:
      type: object
      additionalProperties: false
      required: [id, skuId, quantity]
      properties:
        id: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      additionalProperties: false
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pointer, detail]
            properties:
              pointer: { type: string }
              detail: { type: string }
