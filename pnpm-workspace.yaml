# 앱(store·seller·admin)과 공용 패키지. 앱끼리는 import하지 않고 공유할 것은 packages/로 올린다
packages:
  - apps/*
  - packages/*

# 우리가 게시하는 스펙 패키지는 게시 직후 바로 받는다(스펙 머지 → 소비자 개발이 같은 날 이어진다).
# 외부 패키지는 pnpm 기본 게시 후 대기 시간을 그대로 따른다
minimumReleaseAgeExclude:
  - '@learn-shop-fullstack/*'

# 설치 스크립트 허용 목록. 목록에 없으면 설치가 실패한다(strictDepBuilds 기본값)
allowBuilds:
  # Prism 의존성. 설치 시 사용 통계를 보내는 스크립트라 막는다
  '@scarf/scarf': false

# 여러 패키지가 같이 쓰는 도구의 버전. package.json에는 "catalog:"로 적어 여기서만 올린다
catalog:
  '@tanstack/react-query': 5.105.0
  vitest: 5.0.5
# pnpm add가 catalog 버전만 쓰게 한다. catalog에 없는 버전을 지정하면 실패한다
catalogMode: strict
